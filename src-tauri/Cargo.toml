[package]
name = "archive76"
version = "0.1.0"
description = "Local-first Fallout 76 catalogue application"
authors = ["Archive76 contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[build-dependencies]
tauri-build = "2"
serde_json = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `tauri` with `default` features provides the core window/manager and the
# invoke surface. Additional Tauri plugin APIs (clipboard, dialog, fs, shell,
# etc.) are opt-in via Cargo features as needed; see tauri.conf.json `allowlist`.
tauri = { version = "2", features = ["default"] }
