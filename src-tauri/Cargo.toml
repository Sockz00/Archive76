[package]
name = "archive76"
version = "0.1.0"
description = "Local-first Fallout 76 catalogue application"
authors = ["Archive76 contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[build-dependencies]
tauri-build = "2"
serde_json = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["default"] }

# M2 SQLite + foundation crate set. These are the lockstep versions
# cached in the local crates.io mirror as of this commit:
#   rusqlite 0.32.1, chrono 0.4.45, uuid 1.26.0, thiserror 1.0.69
# The bundled SQLite (libsqlite3-sys 0.30.1) is enabled by default,
# so no system SQLite is required. `chrono` uses std + clock features
# (no time/timezone crates) to keep the dep graph small.
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
